<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../Css/style.css">
    <link rel="stylesheet" href="../Css/auth.css">
    <script src = "../JavaScript/auth.js" defer></script>
</head>
<body class="auth-page">
    <main class="auth-container">
        <h1>Log in</h1>
        <p>Access your saved questions and results.</p>

        <form id="login-form" action="/login" th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
                <button type="button" id="toggle-password" aria-controls="password" aria-pressed="false">
                    Show password
                </button>
            </div>

            <p id="login-error" role="alert" th:text="${param.error != null ? 'Incorrect username or password.' : ''}"></p>

            <p th:if="${param.logout != null}">
                You have been logged out.
            </p>

            <button type="submit">Log in</button>
        </form>
        <p>Need an account? <a href="register.html" th:href="@{/register}">Create an account</a></p>
    </main>
</body>
</html>
