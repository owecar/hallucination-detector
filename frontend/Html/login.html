
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="icon" type="image/svg+xml" href="../Images/brain.svg" th:href="@{/Images/brain.svg}">

    <link rel="stylesheet" th:href="@{/Css/style.css}" href="../Css/style.css">
    <link rel="stylesheet" th:href="@{/Css/auth.css}" href="../Css/auth.css">
    <link rel="stylesheet" th:href="@{/Css/login.css}" href="../Css/login.css">

    <script th:src="@{/JavaScript/auth.js}" src="../JavaScript/auth.js" defer></script>
</head>

<body class="auth-page login-page">

    <main class="login-shell">
        <section class="robot-panel" aria-label="Hallucination Detector AI assistant">
            <img class="robot-image"
                 src="../Images/login-robot.png"
                 th:src="@{/Images/login-robot.png}"
                 alt="Friendly futuristic AI robot with glowing colorful eyes">
        </section>

        <section class="login-panel">
            <div class="login-content">

                <div class="brand-icon" aria-hidden="true">
                    <img src="../Images/brain.svg" th:src="@{/Images/brain.svg}" width="58" height="58" alt="">
                </div>

                <h1>Hallucination Detector</h1>

                <p class="login-description">
                    Verify AI-generated answers with trusted,
                    fact-checked sources.
                </p>

                <form id="login-form"
                      action="/login"
                      th:action="@{/login}"
                      method="post">

                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">✉️</span>
                            <input type="text"
                                   id="username"
                                   name="username"
                                   placeholder="Username or Email"
                                   autocomplete="username"
                                   required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon" aria-hidden="true">🔒</span>
                            <input type="password"
                                   id="password"
                                   name="password"
                                   placeholder="Password"
                                   autocomplete="current-password"
                                   required>

                            <button type="button"
                                    id="toggle-password"
                                    aria-controls="password"
                                    aria-pressed="false">
                                Show password
                            </button>
                        </div>
                    </div>

                    <p id="login-error"
                       role="alert"
                       th:text="${param.error != null ? 'Incorrect username or password.' : ''}">
                    </p>

                    <p class="logout-message"
                       th:if="${param.logout != null}">
                        You have been logged out.
                    </p>

                    <button type="submit" class="login-submit">
                        Log In
                    </button>
                </form>

                <p class="register-link">
                    New here?
                    <a href="register.html" th:href="@{/register}">
                        Create an Account
                    </a>
                </p>

            </div>
        </section>
    </main>

</body>
</html>
