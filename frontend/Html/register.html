<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet"
      th:href="@{/Css/style.css}"
      href="../Css/style.css">

    <link rel="stylesheet"
      th:href="@{/Css/auth.css}"
      href="../Css/auth.css">

    <script th:src="@{/JavaScript/register.js}"
        src="../JavaScript/register.js"
        defer></script>
</head>
<body class="auth-page">
    <main class="auth-container">
        <h1>Create an account</h1>
        <p>Save your questions and access your results.</p>
        
        <form id="register-form" action="/register" th:action="@{/register}" method="post">
            <div class="form-group">
                <label for="account-type">Account type</label>
                <select id="account-type" name="role" required>
                    <option value="">Choose an account type</option>
                    <option value="USER">User</option>
                    <option value="ADMIN">Admin</option>
                    <option value="DB_ADMIN">Database Admin</option>
                </select>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
               autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
               autocomplete="new-password" minlength="8" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm password</label>
                <input type="password" id="confirm-password" name="confirmPassword"
               autocomplete="new-password" minlength="8" required>
            </div>

            <button type="button" id="toggle-passwords"
                    aria-controls="password confirm-password" aria-pressed="false">
                Show passwords
            </button>

            <p id="register-error" role="alert" th:text="${error}"></p>

            <button type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="login.html" th:href="@{/login}">Log in</a></p>
    </main>
</body>
</html>
