<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>View Database Data | Database Administration</title>
    <link rel="stylesheet" href="../Css/style.css" th:href="@{/Css/style.css}">
    <link rel="stylesheet" href="../Css/dbadmin.css" th:href="@{/Css/dbadmin.css}">
    <script src="../JavaScript/dbadmin_data.js" th:src="@{/JavaScript/dbadmin_data.js}" defer></script>
</head>

<body class="dbadmin-page" data-dbadmin-page="view">
    <div th:replace="~{Html/fragments/account-header :: accountHeader}"></div>

    <main class="dbadmin-container">

        <nav class="dbadmin-topnav"
             aria-label="Database administration navigation">

            <a class="dbadmin-link" th:href="@{/dbadmin}" >
                ← Database Admin Dashboard
            </a>

            <div class="dbadmin-actions">
                <a class="dbadmin-link" th:href="@{/dbadmin/database}" >
                    View Data
                </a>

                <a class="dbadmin-link" th:href="@{/dbadmin/update}" >
                    Edit Records
                </a>
            </div>
        </nav>
      
        <header class="dbadmin-header">
            <p class="dbadmin-eyebrow">
                HALLUCINATION DETECTION SYSTEM
            </p>

            <h1>View Database Data</h1>

            <p class="dbadmin-subtitle">
                Explore tables and their stored records.
            </p>
        </header>

        <p class="dbadmin-notice">
            Frontend demonstration only — Not from database
        </p>

        <section class="dbadmin-stats"
                 id="dbadmin-stats"
                 aria-label="Sample record counts">
        </section>

        <section class="dbadmin-panel">

            <h2>Browse Records</h2>

            <div class="dbadmin-toolbar">

                <label>
                    <span class="dbadmin-label">
                        Database table
                    </span>

                    <select class="dbadmin-select"
                            id="dbadmin-table-select">

                        <option value="app_user">app_user</option>
                        <option value="saved_query">saved_query</option>
                        <option value="ai_claim">ai_claim</option>
                        <option value="result">result</option>

                    </select>
                </label>

            </div>

            <p class="dbadmin-muted"
               id="dbadmin-row-count"
               aria-live="polite">
            </p>

            <div class="dbadmin-table-wrap"
                 id="dbadmin-table-container">
            </div>

        </section>

        <section class="dbadmin-panel">

            <div class="dbadmin-actions">

                <a class="dbadmin-link"
                   th:href="@{/dbadmin/update}" >
                    Go to Record Editor →
                </a>

            </div>

        </section>

    </main>

</body>
</html>
