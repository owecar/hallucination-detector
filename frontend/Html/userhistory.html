<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Question History | Hallucination Detector</title>
    <link rel="stylesheet" href="../Css/style.css">
    <link rel="stylesheet" href="../Css/userhistory.css">
    <script src="../JavaScript/userhistory.js" defer></script>
</head>
<body class="userhistory-page">
    <header class="site-header">
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="userhistory.html" aria-current="page">Question History</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="userhistory-container">
        <header class="userhistory-header">
            <h1>My Question History</h1>
            <p>Review your previous questions, AI answers, and verification results.</p>
        </header>

        <section class="userhistory-account" aria-label="Demo account selection">
            <div>
                <h2>Frontend Account Preview</h2>
                <p>This demonstration uses browser-only sample history, not real login or database records.</p>
            </div>
            <label for="userhistory-account-name">Demo username</label>
            <input id="userhistory-account-name" type="text" maxlength="40" autocomplete="off" placeholder="Enter a demo username">
            <button id="userhistory-switch-account" type="button">View Account</button>
        </section>

        <p class="userhistory-current" id="userhistory-current-account" aria-live="polite"></p>
        <section id="userhistory-list" class="userhistory-list" aria-label="Saved questions"></section>
        <p id="userhistory-feedback" class="userhistory-feedback" role="status" aria-live="polite"></p>
        <a class="userhistory-home" href="index.html">← Return to Homepage</a>
    </main>
</body>
</html>
