
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Question History | Hallucination Detector</title>

    <link rel="stylesheet"
          href="../Css/style.css"
          th:href="@{/Css/style.css}">

    <link rel="stylesheet"
          href="../Css/userhistory.css"
          th:href="@{/Css/userhistory.css}">

    <link rel="stylesheet" th:href="@{/Css/admin-sidebar.css}" href="../Css/admin-sidebar.css">
</head>

<body class="userhistory-page admin-workspace">

    <aside th:replace="~{Html/fragments/admin-sidebar :: sidebar('history')}"></aside>

    <main class="userhistory-container" id="userhistory-main">

        <header class="userhistory-header">

            <h1>My Question History</h1>

            <p>
                Review your previous questions,
                AI answers, and verification results.
            </p>

        </header>

        <div class="history-content-card">

            <h2>Previous Questions</h2>
            <p th:if="${message}"
                th:text="${message}"
                role="status"
                class="history-message">
            </p>
            <p id="userhistory-feedback"
               role="status"
               aria-live="polite">
            </p>


                <section id="userhistory-list"
                    aria-label="Saved question history">

                    <p th:if="${#lists.isEmpty(history)}">
                         No saved questions for this account yet. Submit a question and receive an AI answer to start your history.
                    </p>

                    <article class="userhistory-card"
                            th:each="record : ${history}">

                        <div class="userhistory-card-header">
                            <h2 th:text="${record.question}">
                                Question
                            </h2>

                            <span class="userhistory-date"
                                    th:text="${record.createdAt != null ? #temporals.format(record.createdAt, 'MMM dd, yyyy · hh:mm a') : 'Date unavailable'}">
                                Date
                            </span>
                        </div>

                        <p class="userhistory-label">AI ANSWER</p>

                        <p class="userhistory-answer"
                            th:text="${record.answer}">
                        Answer
                        </p>

                        <div class="userhistory-card-actions">

                            <form th:action="@{/history/delete/{id}(id=${record.id})}"
                                    method="post">

                                <button type="submit"
                                        class="userhistory-delete"
                                        onclick="return confirm('Delete this question?')">
                                    Delete Question
                                </button>

                            </form>

                        </div>

                    </article>

                </section>


        </div>

    </main>


</body>
</html>
