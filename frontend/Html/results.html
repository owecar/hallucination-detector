<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Verification Results</title>
        <link rel="stylesheet" th:href="@{/Css/style.css}" href="../Css/style.css">
        <script th:src="@{/JavaScript/results.js}" src="../JavaScript/results.js" defer></script>
    </head>


   <body>
    <div th:replace="~{Html/fragments/account-header :: accountHeader}"></div>
    <header class="site-header">
        <nav class="main-nav" aria-label="Main navigation">
            <a th:href="@{/}" href="index.html">Home</a>
            <a th:href="@{/history}" href="userhistory.html">Question History</a>
        </nav>
    </header>

    <main class="results-container">
        <h1>Verification Results</h1>

        <section class="result-card">
            <h2>Your Question</h2>
            <p th:text="${question}"></p>
        </section>

        <section class="result-card">
            <h2>AI-Generated Answer</h2>
            <p class="ai-answer" th:text="${answer}">
            </p>
        </section>

        <section class="result-card">
            <h2>Hallucination Score</h2>
            <p th:if="${hallucinationScore != null}">
                <strong th:text="${hallucinationScore}"></strong>%
            </p>
            <p th:unless="${hallucinationScore != null}">
                Score not available yet.
            </p>
        </section>

        <section class="result-card">
            <h2>Claim Verification</h2>

            <p th:if="${claims == null or #lists.isEmpty(claims)}">
                No claims were detected.
            </p>

            <div class="claim-card"
                 th:each="claim : ${claims}">

                <p class="claim-text" th:text="${claim.text}">
                </p>

                <p>
                    <strong>Classification:</strong>
                    <span th:text="${claim.label}"></span>
                </p>

                <button type="button"
                        class="evidence-toggle"
                        aria-expanded="false">
                    Show Evidence
                </button>

                <div class="evidence-details" hidden>
                    <h3>Supporting Evidence</h3>
                    <p th:text="${claim.source}">
                        Source not available.
                    </p>
                </div>
            </div>
        </section>

        <div class="form-actions">
            <a class="back-link"
               th:href="@{/}"
               href="index.html">
                Ask Another Question
            </a>
        </div>
    </main>
    </body>
</html>
