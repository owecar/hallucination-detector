<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Records</title>
    <link rel="icon" type="image/svg+xml" href="../Images/brain.svg" th:href="@{/Images/brain.svg}">
    <link rel="stylesheet" href="../Css/style.css" th:href="@{/Css/style.css}">
    <link rel="stylesheet" href="../Css/dbadmin.css" th:href="@{/Css/dbadmin.css}">
    <script src="../JavaScript/dbadmin_data.js" th:src="@{/JavaScript/dbadmin_data.js}" defer></script>
    <link rel="stylesheet" href="../Css/admin-sidebar.css" th:href="@{/Css/admin-sidebar.css}">
</head>

<body class="dbadmin-page admin-workspace" data-dbadmin-page="update">
    <aside th:replace="~{Html/fragments/admin-sidebar :: sidebar('db-edit')}"></aside>

    <main class="dbadmin-container">

        <header class="dbadmin-header">

            <p class="dbadmin-eyebrow">
                HALLUCINATION DETECTION SYSTEM
            </p>

            <h1>Update Database Records</h1>

            <p class="dbadmin-subtitle">
                Choose a PostgreSQL record to edit or delete.
            </p>

        </header>

        <p class="dbadmin-notice">
            Changes made here affect actual PostgreSQL records.
        </p>

        <section class="dbadmin-panel">

            <h2>Select a Record</h2>

            <div class="dbadmin-toolbar">

                <label>
                    <span class="dbadmin-label">
                        Table
                    </span>

                    <select class="dbadmin-select"
                            id="dbadmin-table-select">

                        <option value="saved_query">saved_query</option>
                        <option value="app_user">app_user</option>

                    </select>
                </label>

                <label>
                    <span class="dbadmin-label">
                        Record
                    </span>

                    <select class="dbadmin-select"
                            id="dbadmin-record-select">
                    </select>
                </label>

            </div>

        </section>

        <section class="dbadmin-panel">

            <h2>Edit Record</h2>

            <p th:if="${success}" th:text="${success}" role="status"></p>
            <p th:if="${error}" th:text="${error}" role="alert"></p>

            <select id="dbadmin-source-queries" hidden aria-hidden="true">
                <option th:each="q : ${queries}" th:value="${q.id}"
                        th:attr="data-question=${q.question},data-answer=${q.answer}"
                        th:text="${q.id + ' — ' + q.question}"></option>
            </select>
            <select id="dbadmin-source-users" hidden aria-hidden="true">
                <option th:each="u : ${users}" th:value="${u.id}"
                        th:attr="data-username=${u.username},data-role=${u.role}"
                        th:text="${u.id + ' — ' + u.username}"></option>
            </select>

            <form id="dbadmin-edit-form" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="dbadmin-form-grid"
                     id="dbadmin-form-fields">
                </div>

                <p class="dbadmin-muted">
                    Primary keys and timestamps are read-only.
                </p>

                <div class="dbadmin-actions">

                    <button class="dbadmin-button"
                            type="submit"
                            id="dbadmin-save">
                        Save Changes
                    </button>

                    <button class="dbadmin-button dbadmin-button-danger"
                            type="button"
                            id="dbadmin-delete">
                        Delete Record
                    </button>

                    <button class="dbadmin-button dbadmin-button-secondary"
                            type="button"
                            id="dbadmin-cancel">
                        Discard Changes
                    </button>

                </div>

                <p id="dbadmin-feedback"
                   role="status"
                   aria-live="polite">
                </p>

            </form>
            <form id="dbadmin-delete-form" method="post" hidden>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </form>

        </section>

    </main>

</body>
</html>
