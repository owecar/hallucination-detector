<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Hallucination Detector</title>


        <link rel="stylesheet" th:href="@{/Css/style.css}" href="../Css/style.css">
        
        <script th:src="@{/js/home.js}" src="../JavaScript/home.js" defer></script>
    </head>

    <body class="home-page">
        <div th:replace="~{Html/fragments/account-header :: accountHeader}"></div>
        <header class="site-header">
            <nav class="main-nav" aria-label="Main navigation">
                <a th:href="@{/}" href="index.html">
                    Home
                </a>

                <a th:href="@{/history}" href="userhistory.html">
                    Question History
                </a>
            </nav>
        </header>

        <main class="hero">
            <h1>Hallucination Detector</h1>

            <h2>Welcome, Student / Researcher!</h2>

            <p> Ask a question and explore the reliability of AI-generated answers.</p>

            <section class="question-box">
                <h2>Submit a Question</h2>

                <form id="questionForm" th:action="@{/submit}" action="/submit" method="post" novalidate>
                    <label for="question">
                        Enter your question:
                    </label>
                    <textarea id="question" name="question" placeholder="Type your question here.." required></textarea>
                    <p id="errorMessage" class="error-message" role="alert" hidden></p>
                    <p id="loadingMessage" class="loading-message" role="status" hidden>
                        Processing your question now. Please wait...
                    </p>

                    <div class="form-actions">
                        <button type="reset" id="resetButton">
                            Reset
                        </button>
                        <button type="submit" id="submitButton">
                            Submit Question
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
